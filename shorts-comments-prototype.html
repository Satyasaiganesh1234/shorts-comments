<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909">
<title>Shorts comments — independent concept</title>
<style>
:root{color-scheme:dark;--bg:#090909;--surface:#202124;--surface2:#292a2d;--text:#f1f1f1;--muted:#aaa;--line:#3b3c3f;--pink:#ff4f91;--blue:#a8c7fa;--radius:24px;font:14px/1.4 Roboto,"Arial",sans-serif}*{box-sizing:border-box}body{margin:0;background:#151515;color:var(--text);min-height:100dvh;display:flex;justify-content:center;align-items:center}.device{width:min(100vw,400px);height:min(100dvh,860px);min-height:650px;position:relative;background:#000;overflow:hidden;box-shadow:0 16px 60px #0009}.video{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 34%,#9b5c34 0,#593520 28%,#202023 57%,#090909 90%);display:flex;align-items:center;justify-content:center}.video:before{content:"";position:absolute;inset:0;background:linear-gradient(#0007,transparent 30%,transparent 58%,#000b)}.scene{position:absolute;top:19%;left:22%;width:56%;height:38%;border-radius:48% 48% 18% 18%;background:linear-gradient(110deg,#d3925b,#75452e 60%,#3e2922);filter:blur(1px);opacity:.78}.play{position:absolute;width:52px;height:52px;border-radius:50%;background:#0007;display:grid;place-items:center;font-size:20px;z-index:1}.topbar,.side,.video-caption{position:absolute;z-index:2}.topbar{top:20px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:22px}.video-caption{left:16px;right:76px;bottom:88px}.handle{font-weight:700;margin-bottom:7px}.caption{font-size:14px}.side{right:10px;bottom:92px;display:grid;gap:17px;text-align:center}.side button{background:none;border:0;color:white;font-size:24px;padding:0;cursor:pointer}.side small{display:block;font-size:11px}.open-comments{position:absolute;bottom:20px;left:12px;right:12px;height:48px;border:0;border-radius:28px;background:#28292b;color:#fff;text-align:left;padding:0 16px;font-size:14px;z-index:3;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.open-comments strong{font-size:12px;color:#bbb}.scrim{position:absolute;inset:0;background:#0009;z-index:4;opacity:0;pointer-events:none;transition:opacity 220ms cubic-bezier(.2,0,0,1)}.sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;height:78%;background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;transform:translateY(102%);transition:transform 280ms cubic-bezier(.2,0,0,1);display:flex;flex-direction:column}.device.show .sheet{transform:translateY(0)}.device.show .scrim{opacity:1;pointer-events:auto}.grab{width:32px;height:4px;border-radius:4px;background:#5f6063;margin:10px auto 8px}.sheet-head{padding:0 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.sheet-head h2{font-size:17px;margin:0}.iconbtn{border:0;color:var(--text);background:transparent;font-size:20px;padding:8px;cursor:pointer}.sortrow{display:flex;gap:8px;padding:12px 16px}.chip{border:1px solid var(--line);border-radius:18px;background:transparent;color:var(--text);padding:7px 12px;font-size:12px;cursor:pointer}.chip.active{background:#d3e3fd;color:#101820;border-color:#d3e3fd;font-weight:600}.list{padding:2px 16px 80px;overflow:auto;flex:1}.comment{display:grid;grid-template-columns:34px 1fr;gap:11px;padding:12px 0}.avatar{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#4f405b;color:#eee;font-weight:700}.meta{color:var(--muted);font-size:12px}.body{margin:5px 0 7px;line-height:1.45;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:15px;color:var(--muted);font-size:12px}.actions button{color:inherit;background:none;border:0;padding:4px 0;cursor:pointer;font-size:12px}.actions .react{font-size:16px}.heart{margin-left:auto}.reply{margin-top:10px;display:flex;gap:8px;color:var(--blue);font-weight:600;background:none;border:0;padding:0;cursor:pointer;font-size:12px}.composer{position:absolute;bottom:0;left:0;right:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#101010;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}.field{min-width:0;flex:1;border:0;border-radius:24px;background:#292a2d;color:#fff;height:42px;padding:0 15px;font:14px Arial;outline:0}.field:focus{box-shadow:0 0 0 2px var(--blue)}.send{height:40px;width:40px;border-radius:50%;border:0;background:var(--blue);color:#101820;font-size:19px;cursor:pointer}.send:disabled{opacity:.42}.empty{text-align:center;color:var(--muted);padding:75px 28px}.empty b{display:block;color:#eee;margin-bottom:8px}.toast{position:absolute;z-index:9;bottom:78px;left:50%;transform:translate(-50%,15px);opacity:0;background:#f1f1f1;color:#202124;padding:10px 16px;border-radius:20px;transition:all 180ms;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}.menu{position:absolute;z-index:8;right:12px;top:58px;background:#292a2d;border-radius:14px;padding:5px;box-shadow:0 8px 24px #0008;display:none}.menu button{display:block;background:none;border:0;color:#fff;padding:12px 18px;width:100%;text-align:left}.menu.on{display:block}.statebar{position:absolute;top:58px;left:12px;z-index:3;display:flex;gap:5px;opacity:.75}.statebar button{font-size:10px;background:#222;border:1px solid #555;color:white;border-radius:9px;padding:5px;cursor:pointer}@media(max-height:700px){.sheet{height:85%}}
</style>
</head>
<body><main class="device" id="device" aria-label="Shorts comments concept prototype"><div class="video"><div class="scene"></div><div class="play">▶</div><div class="topbar"><span>‹</span><span>⌕　⋮</span></div><div class="video-caption"><div class="handle">@chaiandframes</div><div class="caption">That first sip after a long day ☕️ #chai #shorts</div></div><div class="side"><div><button aria-label="Like">♡</button><small>12K</small></div><div><button id="sideComments" aria-label="Comments">◉</button><small>482</small></div><div><button aria-label="Share">↗</button><small>Share</small></div></div></div><div class="statebar"><button data-state="normal">Ready</button><button data-state="loading">Loading</button><button data-state="empty">Empty</button><button data-state="error">Error</button><button data-state="offline">Offline</button><button data-state="disabled">Disabled</button></div><button class="open-comments" id="open"><span>♡　Add a comment…</span><strong>482　⌃</strong></button><div class="scrim" id="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="title"><div class="grab"></div><header class="sheet-head"><h2 id="title">Comments <span style="color:#aaa">482</span></h2><button class="iconbtn" id="close" aria-label="Close comments">⌄</button></header><div class="sortrow"><button class="chip active" id="top">Top</button><button class="chip" id="newest">Newest</button><button class="iconbtn" id="more" aria-label="More options">⋮</button></div><div class="list" id="list"></div><form class="composer" id="form"><div class="avatar" style="width:30px;height:30px">Y</div><input class="field" id="input" maxlength="500" placeholder="Add a comment…" aria-label="Write a comment"><button class="send" id="send" disabled aria-label="Send comment">↑</button></form></section><div class="menu" id="menu"><button id="report">⚑　Report comment</button><button id="copy">▢　Copy link</button></div><div class="toast" id="toast" role="status"></div></main>
<script>
const device=document.querySelector('#device'),list=document.querySelector('#list'),toast=document.querySelector('#toast'),input=document.querySelector('#input'),send=document.querySelector('#send');let mode='normal',sort='top',replying='';let comments=[{id:1,name:'Aarav K.',time:'2 hours ago',text:'The sound of that chai pour is so satisfying 😭',likes:86,replies:12,avatar:'A',color:'#59454d'},{id:2,name:'Meera S.',time:'5 hours ago',text:'घर की चाय की याद आ गई ☕️',likes:42,replies:4,avatar:'M',color:'#465d59'},{id:3,name:'Rizwan',time:'1 day ago',text:'Which tea leaves are these? Looks perfect for a rainy evening.',likes:18,replies:2,avatar:'R',color:'#4b5368'}];
function show(){device.classList.add('show');input.focus()}function close(){device.classList.remove('show');document.querySelector('#menu').classList.remove('on')}function say(s){toast.textContent=s;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1900)}function render(){list.innerHTML='';if(mode==='disabled'){list.innerHTML='<div class="empty"><b>Comments are turned off</b>The creator has disabled comments for this video.</div>';document.querySelector('.composer').style.display='none';document.querySelector('.sortrow').style.display='none';return}document.querySelector('.composer').style.display='flex';document.querySelector('.sortrow').style.display='flex';if(mode==='loading'){list.innerHTML='<div class="empty">Loading comments…</div>';return}if(mode==='error'||mode==='offline'){list.innerHTML=`<div class="empty"><b>${mode==='offline'?'You’re offline':'Comments didn’t load'}</b>${mode==='offline'?'Reconnect to see the conversation.':'Try again when your connection is steadier.'}<br><button class="chip" style="margin-top:14px" onclick="setMode('normal')">Try again</button></div>`;return}let visible=mode==='empty'?[]:[...comments];if(sort==='newest')visible.reverse();if(!visible.length){list.innerHTML='<div class="empty"><b>Start the conversation</b>Keep it kind. Your comment will appear here.</div>';return}list.innerHTML=visible.map(c=>`<article class="comment"><div class="avatar" style="background:${c.color}">${c.avatar}</div><div><div class="meta"><b style="color:#eee">${c.name}</b> · ${c.time} <button class="iconbtn" style="float:right;padding:0 5px" onclick="menuFor(${c.id})" aria-label="Comment options">⋮</button></div><div class="body">${esc(c.text)}</div><div class="actions"><button class="react" onclick="like(${c.id},this)" aria-label="Like comment">♡</button><span>${c.likes}</span><button onclick="reply(${c.id},'${c.name}')">Reply</button><button class="heart" onclick="say('Creator heart added')">♡</button></div>${c.replies?`<button class="reply" onclick="say('Thread expanded')">⌄　View ${c.replies} replies</button>`:''}</div></article>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function setMode(s){mode=s;render()}function menuFor(id){document.querySelector('#menu').dataset.id=id;document.querySelector('#menu').classList.toggle('on')}function like(id,b){let c=comments.find(x=>x.id===id);c.likes++;b.textContent='♥';b.style.color='#ff4f91';render()}function reply(id,name){replying=name;input.placeholder='Replying to '+name+'…';input.focus()}document.querySelector('#open').onclick=show;document.querySelector('#sideComments').onclick=show;document.querySelector('#close').onclick=close;document.querySelector('#scrim').onclick=close;document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{setMode(b.dataset.state);if(!device.classList.contains('show'))show()});document.querySelector('#top').onclick=()=>{sort='top';document.querySelector('#top').classList.add('active');document.querySelector('#newest').classList.remove('active');render()};document.querySelector('#newest').onclick=()=>{sort='newest';document.querySelector('#newest').classList.add('active');document.querySelector('#top').classList.remove('active');render()};input.oninput=()=>send.disabled=!input.value.trim();document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;comments.unshift({id:Date.now(),name:'You',time:'now',text:input.value.trim(),likes:0,replies:0,avatar:'Y',color:'#405b78'});input.value='';send.disabled=true;input.placeholder='Add a comment…';replying='';mode='normal';sort='top';render();list.scrollTop=0;say('Comment posted')};document.querySelector('#more').onclick=()=>document.querySelector('#menu').classList.toggle('on');document.querySelector('#report').onclick=()=>{document.querySelector('#menu').classList.remove('on');say('Report submitted for review')};document.querySelector('#copy').onclick=()=>{document.querySelector('#menu').classList.remove('on');say('Comment link copied')};render();
</script></body></html>
